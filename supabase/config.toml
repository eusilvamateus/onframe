# Configuração declarada e publicada pelo repositório para o projeto hospedado.
# SMTP, provedores externos, MFA, URLs de redirecionamento e limites continuam
# administrados no Supabase até que as respectivas superfícies do OnFrame existam.
project_id = "onframe"

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no OnFrame"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Você recebeu um convite para o OnFrame"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso ao OnFrame"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.recovery]
subject = "Redefina sua senha do OnFrame"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail no OnFrame"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} é seu código de verificação do OnFrame"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Sua senha do OnFrame foi alterada"
content_path = "./supabase/templates/password-changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "O e-mail da sua conta OnFrame foi alterado"
content_path = "./supabase/templates/email-changed.html"

[auth.email.notification.phone_changed]
enabled = true
subject = "O telefone da sua conta OnFrame foi alterado"
content_path = "./supabase/templates/phone-changed.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "Um método de verificação foi adicionado à sua conta OnFrame"
content_path = "./supabase/templates/mfa-factor-enrolled.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "Um método de verificação foi removido da sua conta OnFrame"
content_path = "./supabase/templates/mfa-factor-unenrolled.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "Um método de acesso foi conectado à sua conta OnFrame"
content_path = "./supabase/templates/identity-linked.html"

[auth.email.notification.identity_unlinked]
enabled = true
subject = "Um método de acesso foi removido da sua conta OnFrame"
content_path = "./supabase/templates/identity-unlinked.html"
