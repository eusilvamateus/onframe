name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - name: Validate macOS bootstrap syntax
        if: runner.os == 'macOS'
        run: |
          for script in scripts/bootstrap/*.sh; do
            /bin/sh -n "$script"
          done
      - name: Build macOS service and protocol artifacts
        if: runner.os == 'macOS'
        run: |
          test_home="$(mktemp -d)"
          export HOME="$test_home"
          export ONFRAME_HOME="$test_home/Library/Application Support/OnFrame"
          . scripts/bootstrap/common.sh
          mkdir -p "$ONFRAME_HOME/.runtime/node/bin" "$ONFRAME_HOME/service"
          printf '#!/bin/sh\nexit 0\n' > "$ONFRAME_HOME/.runtime/node/bin/node"
          chmod 700 "$ONFRAME_HOME/.runtime/node/bin/node"
          onframe_write_agent
          plutil -lint "$ONFRAME_AGENT_PATH"
          onframe_register_launcher
          plutil -lint "$ONFRAME_LAUNCHER_PATH/Contents/Info.plist"
          test -x "$ONFRAME_HOME/.onframe/commands/update.command"
          onframe_unregister_launcher
          rm -rf "$test_home"
