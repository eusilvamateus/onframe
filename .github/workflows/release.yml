name: Release package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  macos-check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate macOS install, update and uninstall
        run: /bin/sh scripts/test-macos-bootstrap.sh

  package:
    needs: macos-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run release:check
      - name: Prepare release notes
        run: node scripts/release/prepare-release-notes.js $env:GITHUB_REF_NAME --output "dist/release-notes-$($env:GITHUB_REF_NAME).md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "dist/onframe-$($env:GITHUB_REF_NAME).zip" --title "$env:GITHUB_REF_NAME" --notes-file "dist/release-notes-$($env:GITHUB_REF_NAME).md"
