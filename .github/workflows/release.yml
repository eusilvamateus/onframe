name: Release package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run release:check
      - name: Prepare release notes
        run: node scripts/release/prepare-release-notes.js $env:GITHUB_REF_NAME --output "dist/release-notes-$($env:GITHUB_REF_NAME).md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "dist/onframe-$($env:GITHUB_REF_NAME).zip" --title "$env:GITHUB_REF_NAME" --notes-file "dist/release-notes-$($env:GITHUB_REF_NAME).md"
