<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnFrame</title>
  <link rel="stylesheet" href="../../vendor/phosphor/phosphor.css">
  <link rel="stylesheet" href="../../styles/foundations.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/shell.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="ob-shell">
  <main class="popup">
    <header class="header">
      <div class="ob-brand">
        <img src="../../assets/onblide-symbol-primary.svg" alt="">
        <div>
          <p class="ob-eyebrow">OnFrame</p>
          <h1 class="ob-title">Controle <em>rapido</em></h1>
        </div>
      </div>
      <div class="header-actions">
        <a class="version-tag" id="version-tag" data-tooltip="Versão do OnFrame" data-tooltip-placement="bottom" href="https://github.com/eusilvamateus/onframe/releases" target="_blank" rel="noopener noreferrer">v...</a>
        <button class="ob-switch is-on" id="toggle-editor" data-tooltip="Ocultar editor" data-tooltip-placement="bottom" role="switch" aria-checked="true" type="button" aria-label="Ocultar editor"></button>
        <button class="ob-button ghost ob-icon-button" id="open-options" data-tooltip="Abrir opções" data-tooltip-placement="bottom" type="button" aria-label="Abrir opções"></button>
        <button class="ob-button secondary ob-icon-button" id="refresh" data-tooltip="Atualizar" data-tooltip-placement="bottom" type="button" aria-label="Atualizar"></button>
      </div>
    </header>

    <section class="block ob-card">
      <div class="block-head">
        <h2 class="ob-card-title">Acesso remoto</h2>
        <span class="ob-badge grey" id="connection-badge">Verificando</span>
      </div>
      <p class="ob-copy" id="connection-text">Conferindo a vinculação desta extensão.</p>
      <div class="account-list is-hidden" id="account-list" aria-label="Contas Mercado Livre do workspace"></div>
      <div class="update-actions">
        <button class="ob-button primary" id="manage-access" type="button">Gerenciar acesso</button>
      </div>
    </section>

    <section class="block ob-card" id="update-block">
      <div class="block-head">
        <h2 class="ob-card-title">Atualizacao</h2>
        <span class="ob-badge blue" id="update-badge">Disponível</span>
      </div>
      <p class="ob-copy" id="update-text">Use o atualizador para instalar a versão mais recente.</p>
      <div class="update-actions">
        <button class="ob-button primary" id="update-open" type="button">Atualizar agora</button>
      </div>
    </section>
  </main>

  <script src="../../core/icons.js"></script>
  <script src="../../core/shared.js"></script>
  <script src="../../core/toast.js"></script>
  <script src="popup.js"></script>
</body>
</html>
