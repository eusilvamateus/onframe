<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnFrame - Opcoes</title>
  <link rel="stylesheet" href="../../vendor/phosphor/phosphor.css">
  <link rel="stylesheet" href="../../styles/foundations.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/shell.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="ob-shell">
  <main class="page">
    <header class="header">
      <div class="ob-brand">
        <img src="../../assets/onblide-symbol-primary.svg" alt="">
        <div>
          <p class="ob-eyebrow">OnFrame</p>
          <h1 class="ob-title">Opcoes da <em>extensao</em></h1>
        </div>
      </div>
      <div class="header-actions">
        <a class="version-tag" id="version-tag" data-tooltip="Versão do OnFrame" data-tooltip-placement="bottom" href="https://github.com/eusilvamateus/onframe/releases" target="_blank" rel="noopener noreferrer">v...</a>
        <button class="ob-button secondary ob-icon-button" id="refresh" data-tooltip="Atualizar dados" data-tooltip-placement="bottom" type="button" aria-label="Atualizar dados"></button>
      </div>
    </header>

    <section class="panel ob-card remote-panel" aria-labelledby="remote-title">
      <div class="panel-header">
        <h2 class="ob-card-title" id="remote-title">Acesso remoto</h2>
        <span class="ob-badge grey" id="remote-badge">Verificando</span>
      </div>
      <p class="ob-copy" id="remote-text">Conferindo a vinculação desta extensão.</p>
      <div class="remote-connect" id="remote-connect">
        <label class="ob-label" for="remote-pairing-code">Código de pareamento</label>
        <div class="remote-code-controls">
          <input class="ob-field" id="remote-pairing-code" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="27" placeholder="OF-...">
          <button class="ob-button primary compact" id="remote-claim" type="button">Vincular</button>
        </div>
        <button class="ob-button ghost compact remote-pairing-link" id="remote-open-connect" type="button">Abrir pareamento</button>
      </div>
      <div class="remote-context is-hidden" id="remote-context">
        <span><small>Conta</small><strong id="remote-user">-</strong></span>
        <span><small>Workspace</small><strong id="remote-workspace">-</strong></span>
        <span><small>Sessão expira</small><strong id="remote-expires-at">-</strong></span>
      </div>
      <div class="remote-actions is-hidden" id="remote-actions">
        <button class="ob-button secondary compact" id="remote-disconnect" type="button">Desvincular</button>
      </div>
    </section>

    <section class="panel ob-card remote-accounts-panel is-hidden" id="remote-accounts-panel" aria-labelledby="remote-accounts-title">
      <div class="panel-header">
        <h2 class="ob-card-title" id="remote-accounts-title">Contas do workspace</h2>
        <span class="panel-actions">
          <span class="ob-badge grey" id="remote-accounts-badge">Verificando</span>
          <button class="ob-button secondary ob-icon-button compact-icon" id="remote-account-connect" data-tooltip="Conectar conta do Mercado Livre" type="button" aria-label="Conectar conta do Mercado Livre"></button>
        </span>
      </div>
      <p class="ob-copy" id="remote-accounts-text">Buscando contas vinculadas ao workspace.</p>
      <div class="account-list is-hidden" id="remote-accounts-list" aria-label="Contas Mercado Livre do workspace"></div>
    </section>

    <section class="panel ob-card update-block" id="update-block" aria-labelledby="update-title">
      <div class="panel-header">
        <h2 class="ob-card-title" id="update-title">Atualizacao</h2>
        <span class="ob-badge blue" id="update-badge">Disponível</span>
      </div>
      <p class="ob-copy" id="update-text">Use o atualizador para instalar a versão mais recente.</p>
      <div class="update-actions">
        <button class="ob-button primary" id="update-open" type="button">Atualizar agora</button>
      </div>
    </section>
  </main>

  <script src="../../core/icons.js"></script>
  <script src="../../core/shared.js"></script>
  <script src="../../core/toast.js"></script>
  <script src="options.js"></script>
</body>
</html>
